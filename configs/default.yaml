# ============================================================================
# Face Attribute Editing - Default Configuration
# ============================================================================

seed: 42
run_tag: "face_attr_edit_v2_full_inpaint"
smoke_test: false

# ---------------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------------
tasks:
  - add_eyeglasses
  - make_smiling
  - make_older

# ---------------------------------------------------------------------------
# Models
# ---------------------------------------------------------------------------
models:
  sdxl:
    pretrained_model_name_or_path: "stabilityai/stable-diffusion-xl-base-1.0"
    architecture: sdxl
    resolution: 768
    train_batch_size: 1
    gradient_accumulation_steps: 4
    learning_rate: 5.0e-5
    rank: 16
    max_train_steps: 2000
    guidance_scale: 6.5

  sd15:
    pretrained_model_name_or_path: "runwayml/stable-diffusion-v1-5"
    architecture: sd15
    resolution: 512
    train_batch_size: 2
    gradient_accumulation_steps: 4
    learning_rate: 1.0e-4
    rank: 16
    max_train_steps: 2000
    guidance_scale: 7.5

# ---------------------------------------------------------------------------
# Editing
# ---------------------------------------------------------------------------
edit:
  engine: inpainting
  num_candidates_per_image: 3
  num_inference_steps: 30
  strength:
    add_eyeglasses: {sd15: 0.86, sdxl: 0.84}
    make_smiling:   {sd15: 0.78, sdxl: 0.76}
    make_older:     {sd15: 0.88, sdxl: 0.86}
  negative_prompt_common: >-
    different person, identity change, deformed face, blurry, low quality, artifacts
  selection_weights:
    attr_score: 0.70
    attr_delta: 0.15
    identity_score: 0.00
    background_score: 0.10
    lpips_score: 0.05

# ---------------------------------------------------------------------------
# Prompts
# ---------------------------------------------------------------------------
prompts:
  target:
    add_eyeglasses: >-
      a high quality realistic face portrait, wearing natural eyeglasses
      with clear frames and lenses, neutral expression, natural skin texture,
      sharp facial details
    make_smiling: >-
      a high quality realistic face portrait, smiling naturally with raised
      mouth corners, friendly expression, natural skin texture, sharp facial details
    make_older: >-
      a high quality realistic face portrait of an older adult, mature face,
      subtle age lines, natural older facial features, natural skin texture,
      sharp facial details
  negative:
    add_eyeglasses: >-
      deformed face, different person, identity change, extra eyes, bad eyes,
      distorted glasses, blurry, low quality, artifacts
    make_smiling: >-
      deformed mouth, extra teeth, distorted teeth, different person,
      identity change, blurry, low quality, artifacts
    make_older: >-
      different person, identity change, extreme wrinkles, zombie, caricature,
      deformed face, blurry, low quality, artifacts

# ---------------------------------------------------------------------------
# Classifier
# ---------------------------------------------------------------------------
classifier:
  model_name: efficientnet_b0
  image_size: 224
  batch_size: 64
  epochs: 7
  lr: 2.0e-4
  weight_decay: 1.0e-4
  threshold: 0.5
  use_pretrained_imagenet: true
  num_workers: 4

# ---------------------------------------------------------------------------
# Masks
# ---------------------------------------------------------------------------
mask:
  hard_dir: masks_hard
  soft_dir: masks_soft
  coverage_range:
    eyeglasses: [0.018, 0.180]
    smile:      [0.012, 0.160]
    age:        [0.120, 0.600]

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  kaggle_celebamaskhq: "liusonghua/celebamaskhq"
  kaggle_celeba: "jessicali9530/celeba-dataset"
  resolutions: [512, 768, 1024]
  attr_columns: ["Eyeglasses", "Smiling", "Young"]
